[package]
name = "chess-engine"
version = "0.6.1"
edition = "2026"
rust-version = "1.90"

[dependencies]
colored = "3.1.1"
num_enum = "0.7"
strum = "0.28"
strum_macros = "0.28"
rand = "0.8.5"
pretty_assertions = "1.4.0"
atty = "0.2.14"

[dev-dependencies]
ntest = "0.9"

[[bin]]
name = "chess-engine"
path = "main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }